# React Doctor — security, performance, correctness, accessibility,
# bundle-size, and architecture issues in the Next.js frontend.
#
# Docs: https://www.react.doctor/ci

name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      # Full history so PR scans can find the merge base and report only
      # new issues, not the existing backlog.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        with:
          directory: frontend
          # Advisory: reports findings without failing the check.
          # Tighten later with blocking: error | warning.
          blocking: none
