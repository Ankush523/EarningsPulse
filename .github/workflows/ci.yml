name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Socket Firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
          shims: "false"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: sfw uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run --frozen ruff check app tests

      - name: Ruff format check
        run: uv run --frozen ruff format --check app tests

      - name: Unused dependencies (deptry)
        run: uv run --frozen deptry . --github-output

      - name: Type check (ty)
        run: uv run --frozen ty check

      - name: Run pytest
        run: uv run --frozen python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Socket Firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
          shims: "false"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: sfw bun install --frozen-lockfile

      - name: Run property tests
        run: bun run test:property

      - name: Lint (oxlint)
        run: bun run lint

      - name: Unused code (knip)
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      CI: "true"
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Install Socket Firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
          shims: "false"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: sfw uv sync --frozen --no-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: sfw bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: bun run test:e2e
